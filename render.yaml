# Render Blueprint for the Thornvale multiplayer server.
# On Render: New + → Blueprint → pick this repository. Render reads this file,
# builds the browser client and starts the game server, which serves the game
# page and the websocket on the same address (https://<name>.onrender.com).
services:
  - type: web
    name: thornvale
    runtime: node
    plan: free
    region: frankfurt
    buildCommand: npm install --include=dev && npm run build
    startCommand: npm run server
    healthCheckPath: /status
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: "20"
      # how many players may be online at once
      - key: MAX_PLAYERS
        value: "50"
      # test commands (/level, /item, the ` console): "1" lets everyone use them;
      # leave "0" and list names in ADMINS to allow only those characters
      - key: ALLOW_ADMIN
        value: "1"
      - key: ADMINS
        value: ""
      # player-versus-player combat: "1" on (skulls, secure mode, PZ lock), "0" off
      - key: PVP
        value: "1"
      # testing: every character is raised to at least this level at login ("1" = off)
      # testing phase: "1" = everyone gets the test commands (not /god or /kill); "0" before the grand opening
      - key: TEST_MODE
        value: "1"
      - key: START_LEVEL
        value: "20"
      # Supabase keeps accounts and characters safe across restarts and updates.
      # Render asks for these two values when you create or sync the Blueprint
      # (Supabase dashboard → Project Settings → API / API Keys). Run supabase/schema.sql first.
      - key: SUPABASE_URL
        value: https://gvknnzdhxwmqimaoiref.supabase.co
      # public key used by the title screen for email login (safe to share)
      - key: SUPABASE_PUBLISHABLE_KEY
        value: sb_publishable_Do-DXlXiAHd6f8xLCFo_qA_JHrsygW3
      # SECRET: paste it in the Render dashboard, never in this file
      - key: SUPABASE_SERVICE_KEY
        sync: false
